name: chat_demo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  pull_to_refresh_flutter3: ^2.0.2
  drift: ^2.27.0
  drift_flutter: ^0.2.4
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  collection: ^1.19.1
  path: ^1.9.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^16.0.0
  mqtt_client: ^10.10.0
  ellipsized_text: ^2.0.0
  get_it: ^8.0.3
  uuid: ^4.5.1
  flutter_lucide: ^1.6.2
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6
  just_audio: ^0.10.4
  permission_handler: ^11.3.1
  record: ^6.0.0
  flutter_reactive_ble: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.27.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  go_router_builder: ^3.0.1
  dart_pre_commit: ^6.0.0

dart_pre_commit:
  # exclude:
  #   - '.*\.g\.dart$'
  #   - '.*\.freezed\.dart$'
  #   - '^lib/generated/.*\.dart$'
  #   - '^plugins/.*\.generated\.dart$'
  #   - '.*\.generated\.dart$'
  pull-up-dependencies: false
  format:
    line-length: 120
  analyze:
    ignore-unstaged-files: true
  outdated: false
  custom-lint: false
  test-imports: false
  lib-exports: false
  flutter-compat: false

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
flutter_intl:
  enabled: true
